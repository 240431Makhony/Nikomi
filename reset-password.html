<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новый пароль - Nikomi</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-page { min-height:100vh; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#FAF7F2 0%,#F0EDE6 50%,#E8F5F4 100%); padding:24px; font-family:'DM Sans',sans-serif; }
        .auth-card { background:#FFFDF9; border-radius:24px; padding:40px; width:100%; max-width:420px; box-shadow:0 8px 40px rgba(180,160,130,0.15); border:1px solid #E8E0D5; }
        .auth-logo { display:flex; align-items:center; gap:10px; margin-bottom:28px; }
        .auth-logo img { width:36px; height:36px; border-radius:10px; object-fit:contain; }
        .auth-logo span { font-size:20px; font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; color:#2E2E2E; }
        .auth-title { font-size:26px; font-weight:800; font-family:'Plus Jakarta Sans',sans-serif; color:#2E2E2E; margin-bottom:6px; }
        .auth-subtitle { font-size:14px; color:#7A6F65; margin-bottom:28px; line-height:1.5; }
        .auth-form-group { margin-bottom:16px; }
        .auth-form-group label { display:block; font-size:13px; font-weight:600; color:#2E2E2E; margin-bottom:6px; }
        .auth-form-group input { width:100%; padding:12px 14px; border:1.5px solid #E8E0D5; border-radius:10px; font-size:14px; font-family:'DM Sans',sans-serif; background:white; color:#2E2E2E; transition:all 0.2s; box-sizing:border-box; }
        .auth-form-group input:focus { outline:none; border-color:#3AB0A8; box-shadow:0 0 0 3px rgba(58,176,168,0.12); }
        .btn-auth-primary { width:100%; padding:13px; background:linear-gradient(135deg,#3AB0A8,#319E97); color:white; border:none; border-radius:10px; font-size:15px; font-weight:700; cursor:pointer; transition:all 0.2s; margin-bottom:12px; box-shadow:0 4px 14px rgba(58,176,168,0.3); }
        .btn-auth-primary:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 6px 20px rgba(58,176,168,0.4); }
        .btn-auth-primary:disabled { opacity:0.75; cursor:not-allowed; }
        .auth-footer { text-align:center; margin-top:20px; font-size:14px; color:#7A6F65; }
        .auth-footer a { color:#3AB0A8; font-weight:600; text-decoration:none; }
        .auth-footer a:hover { text-decoration:underline; }
        .message { border-radius:8px; padding:10px 14px; font-size:13px; margin-bottom:14px; display:none; line-height:1.4; }
        .message.error { background:rgba(229,115,115,0.1); color:#c62828; border:1px solid rgba(229,115,115,0.3); }
        .message.success { background:rgba(58,176,168,0.12); color:#237b75; border:1px solid rgba(58,176,168,0.3); }
        body { opacity:1; }
        body.loaded { opacity:1; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="pers/iconka.png" alt="Nikomi">
                <span>Nikomi</span>
            </div>
            <h1 class="auth-title">Новый пароль</h1>
            <p class="auth-subtitle">Придумайте новый пароль для аккаунта. Минимум 6 символов.</p>

            <div id="message" class="message"></div>

            <form id="resetPasswordForm">
                <div class="auth-form-group">
                    <label>Новый пароль</label>
                    <input type="password" id="newPassword" placeholder="Минимум 6 символов" required minlength="6">
                </div>
                <div class="auth-form-group">
                    <label>Повторите пароль</label>
                    <input type="password" id="confirmPassword" placeholder="Повторите новый пароль" required minlength="6">
                </div>
                <button type="submit" class="btn-auth-primary">Сохранить пароль</button>
            </form>

            <div class="auth-footer">
                <a href="simple-login.html">Вернуться ко входу</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { supabase, updatePassword } from './js/supabase.js?v=password-reset';

        const form = document.getElementById('resetPasswordForm');
        const messageEl = document.getElementById('message');

        function showMessage(text, type) {
            messageEl.textContent = text;
            messageEl.className = `message ${type}`;
            messageEl.style.display = 'block';
        }

        async function ensureRecoverySession() {
            const { data, error } = await supabase.auth.getSession();
            if (error || !data.session) {
                showMessage('Ссылка устарела или уже была использована. Запросите восстановление пароля заново.', 'error');
                form.querySelector('button[type=submit]').disabled = true;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const btn = form.querySelector('button[type=submit]');

            if (password.length < 6) {
                showMessage('Пароль должен быть минимум 6 символов.', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Пароли не совпадают.', 'error');
                return;
            }

            btn.textContent = 'Сохраняем...';
            btn.disabled = true;

            const result = await updatePassword(password);

            if (result.success) {
                showMessage('Пароль обновлен. Сейчас перенаправим вас на вход.', 'success');
                await supabase.auth.signOut();
                setTimeout(() => window.location.href = 'simple-login.html', 1600);
            } else {
                showMessage(result.error || 'Не удалось обновить пароль. Попробуйте запросить новую ссылку.', 'error');
                btn.textContent = 'Сохранить пароль';
                btn.disabled = false;
            }
        });

        ensureRecoverySession();
    </script>
</body>
</html>
