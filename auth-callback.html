<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nikomi — Вход...</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #FAF7F2 0%, #F0EDE6 50%, #E8F5F4 100%);
            font-family: 'DM Sans', sans-serif;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #E8E0D5;
            border-top-color: #3AB0A8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        p { color: #7A6F65; font-size: 15px; margin: 0; }
        .error { color: #c62828; margin-top: 12px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Выполняем вход...</p>
        <div class="error" id="errorMsg"></div>
    </div>

    <script type="module">
        import { supabase } from './js/supabase.js';

        async function handleCallback() {
            try {
                // Supabase автоматически обрабатывает токен из URL hash
                const { data, error } = await supabase.auth.getSession();

                if (error) {
                    document.getElementById('errorMsg').textContent = 'Ошибка: ' + error.message;
                    setTimeout(() => window.location.href = 'simple-login.html', 2000);
                    return;
                }

                if (data.session) {
                    // Успешно — идём в приложение
                    window.location.href = 'main.html';
                } else {
                    // Нет сессии — на страницу входа
                    window.location.href = 'simple-login.html';
                }
            } catch (err) {
                document.getElementById('errorMsg').textContent = 'Ошибка: ' + err.message;
                setTimeout(() => window.location.href = 'simple-login.html', 2000);
            }
        }

        handleCallback();
    </script>
</body>
</html>
